apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts-business
  namespace: pharmago
data:
  business-alerts.yaml: |
    apiVersion: 1

    groups:
      - orgId: 1
        name: PharmaGo Business Alerts
        folder: PharmaGo
        interval: 1m
        rules:
          - uid: pharmago-business-events-failed-gt-5-5m
            title: PharmaGo - Eventos de negocio fallidos > 5 en 5m
            condition: C
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  editorMode: code
                  expr: sum(increase(pharmago_business_events_total{outcome="failed"}[5m]))
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  refId: B
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  datasource:
                    type: __expr__
                    uid: __expr__
                  conditions:
                    - evaluator:
                        params:
                          - 5
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        type: last
                      type: query
                  expression: B
                  refId: C
                  type: threshold
            noDataState: OK
            execErrState: Error
            for: 0m
            annotations:
              summary: Mas de 5 eventos de negocio fallidos en los ultimos 5 minutos.
              description: La metrica pharmago_business_events_total con outcome="failed" supero el umbral configurado.
              dashboardUid: pharmago-business
            labels:
              service: pharmago
              domain: business
              metric: pharmago_business_events_total
              severity: warning
