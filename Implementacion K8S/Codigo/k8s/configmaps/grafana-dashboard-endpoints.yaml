apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-endpoints
  namespace: pharmago
data:
  pharmago-endpoints.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"mappings": [], "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}, "unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {"displayMode": "gradient", "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "orientation": "horizontal", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "showUnfilled": true},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "topk(10, sum by (endpoint) (rate(pharmago_http_requests_total_1[5m])))", "legendFormat": "{{endpoint}}", "refId": "A"}],
          "title": "Top 10 endpoints por trafico",
          "type": "bargauge"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"mappings": [], "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 500}, {"color": "red", "value": 1000}]}, "unit": "ms"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {"displayMode": "gradient", "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "orientation": "horizontal", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "showUnfilled": true},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "topk(10, sum by (endpoint) (rate(pharmago_http_request_duration_milliseconds_ms_sum[5m])) / sum by (endpoint) (rate(pharmago_http_request_duration_milliseconds_ms_count[5m])))", "legendFormat": "{{endpoint}}", "refId": "A"}],
          "title": "Top 10 endpoints por latencia promedio",
          "type": "bargauge"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"mappings": [], "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]}, "unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "options": {"displayMode": "gradient", "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "orientation": "horizontal", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "showUnfilled": true},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "topk(10, sum by (endpoint) (rate(pharmago_http_errors_total_1[5m])))", "legendFormat": "{{endpoint}}", "refId": "A"}],
          "title": "Top 10 endpoints con mas errores",
          "type": "bargauge"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"mappings": [], "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "options": {"legend": {"displayMode": "table", "placement": "right", "showLegend": true, "values": ["value", "percent"]}, "pieType": "pie", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "tooltip": {"mode": "single", "sort": "desc"}},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (http_status_code) (rate(http_server_duration_ms_count[5m])) / scalar(sum(rate(http_server_duration_ms_count[5m]))) * 100", "legendFormat": "{{http_status_code}}", "refId": "A"}],
          "title": "Distribucion de status codes",
          "type": "piechart"
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["pharmago", "endpoints"],
      "templating": {"list": []},
      "time": {"from": "now-15m", "to": "now"},
      "timepicker": {"refresh_intervals": ["5s", "10s", "30s", "1m", "5m", "15m", "30m", "1h"]},
      "timezone": "",
      "title": "PharmaGo - Endpoint Analysis",
      "uid": "pharmago-endpoints",
      "version": 0,
      "weekStart": ""
    }
