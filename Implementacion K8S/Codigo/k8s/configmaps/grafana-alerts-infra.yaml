apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts-infra
  namespace: pharmago
data:
  infra-alerts.yaml: |
    apiVersion: 1
    groups:
        - orgId: 1
          name: Infra
          folder: PharmaGo
          interval: 1m
          rules:
            - uid: ffnrfmrjbe6m8d
              title: PharmaGo - CPU alta por servicio > 80%
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: prometheus
                  model:
                    disableTextWrap: false
                    editorMode: code
                    expr: avg by (service) (label_replace(sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="pharmago",pod=~"pharmago-(api-gateway|users-service|pharmacy-service|ui)-.*"}[5m])) * 100, "service", "$1", "pod", "(pharmago-[a-z-]+)-[a-f0-9]+-[a-z0-9]+"))
                    fullMetaSearch: false
                    includeNullMetadata: true
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                    useBackend: false
                - refId: B
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params: []
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - B
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    reducer: last
                    refId: B
                    type: reduce
                - refId: C
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 80
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: B
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 5m
              annotations:
                summary: CPU alta en servicio {{ $labels.service }}
              labels:
                domain: infra
                scope: service
                severity: warning
              isPaused: false

            - uid: pharmago-memory-high
              title: PharmaGo - Memoria alta por servicio > 80%
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                        type: prometheus
                        uid: prometheus
                    editorMode: code
                    expr: 100 * sum by (service) (label_replace(container_memory_working_set_bytes{namespace="pharmago",pod=~"pharmago-(api-gateway|users-service|pharmacy-service|ui)-.*"}, "service", "$1", "pod", "(pharmago-[a-z-]+)-[a-f0-9]+-[a-z0-9]+")) / sum by (service) (label_replace(container_spec_memory_limit_bytes{namespace="pharmago",pod=~"pharmago-(api-gateway|users-service|pharmacy-service|ui)-.*"} > 0, "service", "$1", "pod", "(pharmago-[a-z-]+)-[a-f0-9]+-[a-z0-9]+"))
                    instant: true
                    intervalMs: 1000
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: __expr__
                  model:
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    reducer: last
                    refId: B
                    type: reduce
                - refId: C
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 80
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: B
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 1m
              annotations:
                summary: Memoria alta en servicio {{ $labels.service }}
              labels:
                domain: infra
                scope: service
                severity: warning
              isPaused: false

            - uid: pharmago-pharmacy-storage-writes-high
              title: PharmaGo - Pharmacy ephemeral storage writes > 90%
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                        type: prometheus
                        uid: prometheus
                    editorMode: code
                    expr: 100 * sum by (pod) (container_fs_writes_bytes_total{namespace="pharmago", pod=~"pharmago-pharmacy-service.*", device="/dev/sde"}) / 1024 / 1024 / 128
                    instant: true
                    intervalMs: 1000
                    legendFormat: "{{pod}}"
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: __expr__
                  model:
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    reducer: last
                    refId: B
                    type: reduce
                - refId: C
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 90
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: B
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: OK
              execErrState: Error
              for: 0m
              annotations:
                summary: Pharmacy service supero el 90% del limite aproximado de ephemeral storage
                description: Basado en escrituras acumuladas por pod sobre un limite declarado de 128Mi.
              labels:
                domain: infra
                service: pharmago-pharmacy-service
                severity: warning
              isPaused: false

        - orgId: 1
          name: API
          folder: PharmaGo
          interval: 1m
          rules:
            - uid: pharmago-api-latency-high
              title: PharmaGo - Latencia promedio > 1000ms
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                        type: prometheus
                        uid: prometheus
                    editorMode: code
                    expr: (sum(rate(pharmago_http_request_duration_milliseconds_ms_sum[5m])) / sum(rate(pharmago_http_request_duration_milliseconds_ms_count[5m]))) or vector(0)
                    instant: true
                    intervalMs: 1000
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: __expr__
                  model:
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    reducer: last
                    refId: B
                    type: reduce
                - refId: C
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 1000
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: B
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: OK
              execErrState: Error
              for: 1m
              annotations:
                summary: Latencia promedio HTTP alta
              labels:
                domain: api
                service: pharmago
                severity: warning
              isPaused: false

            - uid: pharmago-api-error-rate-high
              title: PharmaGo - Alta Tasa de Error > 1%
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                        type: prometheus
                        uid: prometheus
                    editorMode: code
                    expr: sum(rate(pharmago_http_errors_total_1[5m])) / sum(rate(pharmago_http_requests_total_1[5m])) * 100
                    instant: true
                    intervalMs: 1000
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: __expr__
                  model:
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    reducer: last
                    refId: B
                    type: reduce
                - refId: C
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 1
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: B
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: OK
              execErrState: Error
              for: 0m
              annotations:
                summary: Tasa de error HTTP superior al 1% en los ultimos 5 minutos
              labels:
                domain: api
                service: pharmago
                severity: critical
              isPaused: false

            - uid: pharmago-api-http-429-high
              title: PharmaGo - Rate limit HTTP 429 > 10 en 5m
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                        type: prometheus
                        uid: prometheus
                    editorMode: code
                    expr: sum(increase(pharmago_http_requests_total_1{status_code="429"}[5m]))
                    instant: true
                    intervalMs: 1000
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: __expr__
                  model:
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    reducer: last
                    refId: B
                    type: reduce
                - refId: C
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 10
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: B
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: OK
              execErrState: Error
              for: 0m
              annotations:
                summary: Mas de 10 respuestas HTTP 429 en los ultimos 5 minutos
              labels:
                domain: api
                service: pharmago
                severity: warning
              isPaused: false

        - orgId: 1
          name: API Demo
          folder: PharmaGo
          interval: 10s
          rules:
            - uid: pharmago-api-endpoint-latency-high
              title: PharmaGo - Latencia P95 alta
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: prometheus
                  model:
                    datasource:
                        type: prometheus
                        uid: prometheus
                    editorMode: code
                    expr: (histogram_quantile(0.95, sum by (endpoint, le) (rate(pharmago_http_request_duration_milliseconds_ms_bucket{endpoint!~"/health|/metrics"}[5m]))) > bool 1500) and on(endpoint) (sum by (endpoint) (increase(pharmago_http_request_duration_milliseconds_ms_count{endpoint!~"/health|/metrics"}[5m])) > 0)
                    instant: true
                    intervalMs: 1000
                    legendFormat: "{{endpoint}}"
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: __expr__
                  model:
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    reducer: last
                    refId: B
                    type: reduce
                - refId: C
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 0
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: B
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: OK
              execErrState: Error
              for: 30s
              annotations:
                summary: Latencia P95 alta en endpoint de Pharmacy
                description: El endpoint {{ $labels.endpoint }} supero 1500ms de latencia P95 durante la ventana evaluada.
              labels:
                chaos: app-latency
                domain: api
                service: pharmago-pharmacy-service
                severity: warning
              isPaused: false
