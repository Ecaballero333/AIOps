            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "100 * sum by (pod) (\n  container_fs_writes_bytes_total{\n    namespace=\"pharmago\",\n    pod=~\"pharmago-pharmacy-service.*\",\n    device=\"/dev/sde\"\n  }\n) / 1024 / 1024 / 128",
              "instant": false,
              "legendFormat": "{{pod}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "PharmacyService Ephemeral Storage Usage (% del limite)",
          "type": "timeseries"
        }
      ],
      "refresh": "auto",
      "schemaVersion": 39,
      "tags": [
        "pharmago",
